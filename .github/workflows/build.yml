name: Build
on: push
jobs:
  keycheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check the update-signing key matches the app's public key
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          pip install --quiet cryptography
          python3 - <<'PY'
          import base64, os
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          k = os.environ.get("SPARKLE_KEY", "").strip()
          if not k:
              print("::error::SPARKLE_ED_PRIVATE_KEY is not set"); raise SystemExit(1)
          seed = base64.b64decode(k)
          print("key bytes:", len(seed))
          pub = Ed25519PrivateKey.from_private_bytes(seed).public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          ok = base64.b64encode(pub).decode() == "8APL1L4Umo8jgd9zTe5wnPvH/eDtIesuG8VnB2T04PM="
          print("::notice::KEY MATCHES" if ok else "::error::KEY DOES NOT MATCH")
          raise SystemExit(0 if ok else 1)
          PY

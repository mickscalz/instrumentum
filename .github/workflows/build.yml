name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version && sw_vers && uname -m
      - name: Test
        timeout-minutes: 40
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Report
        if: always()
        run: |
          {
            echo "FAILED TESTS: $(grep -E "Test Case '.*' failed" test.log | sed -E "s/.*-\[[A-Za-z]+\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\].*/\1.\2/" | sort -u | tr '\n' ' ')"
            grep -E "Executed [0-9]+ tests" test.log | tail -n 1
            echo "FAILURES:"
            grep -E "error:|: error|Fatal|crashed|signal" test.log | grep -v "^\s*$" | sed -E 's,^/.*/(Tests|Sources)/,\1/,' | cut -c1-200 | head -n 40
            grep -E "Test Suite '(All|Selected) tests'|Executed [0-9]+ tests" test.log | tail -n 2
            if grep -q "unexpected signal" test.log; then echo "LAST LINES:"; grep -vE "^\[[0-9]+/[0-9]+\]" test.log | tail -n 30; fi
            swift --version 2>&1 | head -1
            grep -E "error:|warning: |Test Suite '(All|Selected) tests'|Test Case .*(failed|skipped)|Test Suite '[A-Za-z]+Tests' (passed|failed)|Executed [0-9]+ test|: error|failed \(|skipped|Compiling|Build complete" test.log | grep -v "^\s*$" | tail -n 160
          } > report.txt
          python3 -c "import sys,urllib.parse;t=open('report.txt').read()[-60000:];print('::notice title=test-report::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"

  previews:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/m3a' || github.ref == 'refs/heads/sets' || github.ref == 'refs/heads/sets-3-4' || github.ref == 'refs/heads/sets-5-6' || github.ref == 'refs/heads/sets-7-8' || github.ref == 'refs/heads/sets-9-10' || github.ref == 'refs/heads/sets-11-12' || github.ref == 'refs/heads/small-wins' || github.ref == 'refs/heads/sets-13-14')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Render preview frames
        run: PREVIEW_DIR="$PWD/previews" DEMO_DIR="$PWD/previews/audio" swift test --filter "PreviewRenderTests|ShaderPreviewArtTests|DemoRenderTests|SkyPreviewTests|WorldPreviewTests" 2>&1 | tee preview.log; exit ${PIPESTATUS[0]}
      - name: Encode demo audio
        run: |
          for f in previews/audio/*.wav; do [ -f "$f" ] && afconvert -f m4af -d aac -b 256000 "$f" "${f%.wav}.m4a" && rm "$f"; done
          ls -la previews/audio || true
      - name: Render icon and installer art
        run: |
          brew install librsvg >/dev/null
          rsvg-convert -w 512 -h 512 Packaging/AppIcon.svg -o previews/app-icon.png
          rsvg-convert -w 1320 -h 800 Packaging/dmg-background.svg -o previews/dmg-background.png
      - name: Publish to previews branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la previews
          cd previews
          git init -q && git checkout -q -b previews
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "previews for $GITHUB_SHA"
          # The push has hung on GitHub's side now and then: give each try two minutes, three tries.
          for i in 1 2 3; do
            perl -e 'alarm 120; exec @ARGV' git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" previews && exit 0
            echo "push attempt $i failed or timed out"; sleep 10
          done
          exit 1
      - name: Report
        if: always()
        run: |
          grep -E "error:|warning: |passed|failed|skipped" preview.log | tail -n 40 > report.txt || true
          python3 -c "t=open('report.txt').read()[-60000:];print('::notice title=preview-report::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"

  package:
    # Builds the installer as soon as the app compiles, so a failing test never holds back a playable build.
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Packaging tools
        run: |
          brew install librsvg >/dev/null
          pip3 install --break-system-packages --quiet dmgbuild || pip3 install --quiet dmgbuild
      - name: Build app
        run: Scripts/make-app.sh "$GITHUB_RUN_NUMBER" 2>&1 | tee package.log; exit ${PIPESTATUS[0]}
      - name: Build installer
        run: Scripts/make-dmg.sh "$GITHUB_RUN_NUMBER" 2>&1 | tee -a package.log; exit ${PIPESTATUS[0]}
      - name: Check it is an Intel app for macOS 13+
        run: |
          BIN="dist/In Strum Meants.app/Contents/MacOS/InStrumMeants"
          ARCHS=$(lipo -archs "$BIN"); MINOS=$(vtool -show-build "$BIN" | awk '/minos/ {print $2}')
          echo "archs=$ARCHS minos=$MINOS" | tee -a package.log
          test "$ARCHS" = "x86_64"
          test "$MINOS" = "13.0"
          codesign --verify --verbose "dist/In Strum Meants.app" 2>&1 | tee -a package.log
      - name: Check the installer
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          check() { if eval "$2"; then echo "CHECK ok: $1" | tee -a package.log; else echo "CHECK FAILED: $1" | tee -a package.log; FAIL=1; fi; }
          FAIL=0
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/dmgcheck "$DMG" 2>&1 | tail -1 | sed 's/^/CHECK attach: /' | tee -a package.log
          echo "CHECK contents: $(ls -A /tmp/dmgcheck | tr '\n' ' ')" | tee -a package.log
          check "app present" 'test -d "/tmp/dmgcheck/In Strum Meants.app"'
          check "Applications link" 'test -L /tmp/dmgcheck/Applications && test "$(readlink /tmp/dmgcheck/Applications)" = "/Applications"'
          check "background" 'ls /tmp/dmgcheck/.background* >/dev/null 2>&1'
          check "app icon" 'test -f "/tmp/dmgcheck/In Strum Meants.app/Contents/Resources/AppIcon.icns"'
          hdiutil detach /tmp/dmgcheck >/dev/null || true
          test $FAIL = 0 && echo "dmg ok: $DMG" | tee -a package.log
          exit $FAIL
      - name: Render demo audio
        if: github.ref == 'refs/heads/main'
        run: |
          DEMO_DIR="$PWD/dist/demo" swift test --filter DemoRenderTests 2>&1 | tail -n 5
          for f in dist/demo/*.wav; do [ -f "$f" ] && afconvert -f m4af -d aac -b 256000 "$f" "${f%.wav}.m4a"; done
          ls -la dist/demo
      - name: Keep build
        uses: actions/upload-artifact@v4
        with:
          name: In-Strum-Meants-build-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/*.dmg
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          **$(git log -1 --pretty=%s)**

          **Install:** download the **.dmg** below and open it, drag *In Strum Meants* onto *Applications* (choose **Replace** if asked), then right-click the app → **Open** → **Open** (first time only). The .zip is a fallback.

          **Sets 11 & 12 — Deep Water: Submarine Window and Great Barrier Reef.** Two new sets at the end of the gallery, each a world, a visual, an instrument and a soundscape that belong together, on two new instrument cores: an analogue voice, and mallet bars over tuned tubes.

          - **Submarine Window** (after RÜFÜS DU SOL's "Underwater"; mood: pressure, hush). Inside a small research submarine at its big round porthole: thick acrylic in a brass ring, cables and a padded console edge in silhouette, a brass depth gauge whose needle reads your depth, and a round sonar screen whose sweep turns every 6 s and leaves a fading blip for every note you play; the keys are a row of backlit console buttons. The cabin keeps the sky's time: a dim, cool white by day, red night lighting after dark. Outside is the sea at the **Depth** you choose, from 15 m down to 1,000 m: in the shallows blue-green water, light shafts, caustics on a far slope of sand and coral, and the whole sky squeezed into a bright circle overhead (Snell's window: rain pocks it, sea smoke turns it milky, and on a clear night a bright meteor may flicker through it); deeper down, darkness and living light, lanternfish, jellies and marine snow drifting through the **Outside lamps**. Instrument: **Blue Depth** (the first instrument on the new analogue voice: a plucked synth that blinks the chord you hold on the sixteenths through a murky dotted-eighth echo, with ghostly voices rising behind it and a big bass under the left hand; presets Blue Depth, Ghost Signal, Pressure Hull, Surface Light). Visual: **Deep Lights**: each note releases a glowing creature at its pitch's height (slow jellies low, shimmering comb jellies in the middle, bright specks high) that blinks with the arp while you hold it; runs send a lanternfish shoal flashing past, chords a long siphonophore drifting behind, coloured by the chord (the deep sea's one red light when it is tense), and hard notes a stream of bubbles up the glass. Its card is original art: sonar rings, seven bubbles and a dial, nothing taken from the record.
          - **Great Barrier Reef** (mood: colourful, alive). At the edge of a coral cay's lagoon, the camera right at the waterline, facing east over the reef crest. Above the water: the sky over the Coral Sea, a low white cay with pisonia trees and beach grass, the swell breaking white on the far crest, terns and noddies wheeling by day, and the lagoon mirroring the sky. Below it: staghorn, plate, brain and soft corals on white sand, a giant clam and small blue-green fish, with light shafts and caustics by day; the keys are a strip of wet sand. At night the polyps open and glow, and on **spawning nights** (one to six nights after the October, November and December full moons, a few hours after sunset) the coral spawn rises like snow falling upward. It is too warm here for snow or frost: snow falls as rain, and sea smoke is a morning haze. Instrument: **Reef Marimba** (rosewood bars over tuned tubes, on the new mallet core: struck wood that blooms through its tube, with overtones that die away 4 and 10 times faster than the note, as on a real marimba; presets Reef Marimba, Soft Yarn, Lagoon Steel, Night Reef). Visual: **Coral Pulse**: each note opens and lights the polyps of the coral group nearest its key (brain corals for the bass, staghorn tips for the treble) in fluorescent green, orange or pink; runs send the school darting along your melody (**Fish** sets how many), and chords sweep a wave of colour across the reef. **Waterline** moves the surface from more reef to more sky, and **Coral spawning** follows the calendar or makes tonight a spawning night. It is born from its place, not from a song, so it shows a place card: three coral heads with 1, 4 and 10 polyps lit, the marimba bar's tuning.
          - **Real meteor showers in every night sky:** fourteen showers on their real dates (the Quadrantids, the Lyrids, the η-Aquariids, the Perseids, the Orionids, the Leonids, the Geminids and more), at the rate your city sees them and from their real radiants among the stars, plus the scattered meteors that peak before dawn. Thin streaks coloured by their speed, the fast bright ones leaving a fading green train, now and then a fireball that lights the sky; in the reflections too. Every world with a night sky gains a **Meteors** choice (Follow the calendar, Always a shower, Never), Advanced's Sky extras a **Meteors** slider (how many, as a multiple of a real night), and the Sky panel shows tonight's shower, for example "Meteors: the Leonids — peak in 13 days; the radiant rises at 01:12". The Gentle, Dramatic and Dreamy looks set the new slider too.
          - **A new weather, Sea smoke:** bitter air over open water, with wisps of steam rising off the lake, the sea, the fjord and the bay, gold-pink at sunrise and blue-grey under the moon. The window worlds show it as a low frost haze.
          - **New sounds:** a sonar that pings **in the key you are playing in**, the hull creaking under the pressure, a far-off humpback's song, bubbles, the reef's snapping shrimp and the fish chorus's drumming at dusk.

          **Hear them first:** blue-depth-demo, reef-marimba-demo, submarine-window-ambience and great-barrier-reef-ambience are below (original clips rendered on the build machine, never the song: aboard the submarine with a sonar ping in F♯ and a burst of bubbles, and the reef at dusk).

          **Ear-and-eye checklist:**
          - **The arp and echo against "Underwater":** play along in **F♯ minor** at **118** (Blue Depth's default Tempo) and hold a chord from C3 up: it blinks round the notes on the sixteenths in the order you pressed them, and the dotted-eighth echo should lock to the record. Let go and the echo rings on. **Tempo** sets the arp and the echo together (70 to 160 BPM), and **Blink** goes from struck notes to a light, quick blink.
          - **The ghosts on pressure:** lean into a held chord (aftertouch, if your keyboard sends it): the filter opens and the ghostly voices swell behind it. **Ghosts** sets how much, **Murk** how deep under water it sounds; the pitch wheel bends everything two semitones.
          - **The bass split:** notes below C3 are held, deep and never blinked, under the arp; **Bass** sets how big.
          - **The marimba's rolls and mallets:** hold a note a moment (about a third of a second) and two mallets take turns on the bar; press harder and the roll quickens and swells. **Roll** sets how fast (at 0 nothing rolls). **Mallet** goes from soft yarn to hard rubber (low notes take a softer mallet by themselves), **Strike** from the centre of the bar to its end, **Tube** from a dry pop to the full bloom, and **Steel** lays tuned steel over the wood.
          - **A meteor night:** check the **Meteors tonight** line in the Sky panel (in November, the Leonids), then watch a clear night sky in the lake, the fjord or the reef, and its reflection. Set a world's **Meteors** to **Always a shower** for a steady shower any night.
          - **Sea smoke on the lake at dawn:** in Moonlit Lake pick **Sea smoke** (Sky → Weather → Pick) and hold the light at **Pastel dawn**: wisps should rise off the water and catch the sunrise.
          - **The sonar in your key:** in the submarine, play a while in one key and the next ping (every 14 to 30 s) rings that key's keynote, high and pure; a ping that is ringing never changes. Until it hears a key it pings E.
          - **Smoothness** on Smooth (Display → Quality → Smooth).

          **Sets 9 & 10 — Still Places: Tea House Snow and Zen Rock Garden.** Two new sets at the end of the gallery, each a world, a visual, an instrument and a soundscape that belong together. Both are born from their places, not from songs, so each shows a place card instead of an "Inspired by" credit.

          - **Tea House Snow** (mood: delicate, hushed). Kneeling at a low table in a small tea house: tatami, a hanging scroll, a tea bowl steaming and an iron kettle on its brazier, the paper screens slid half open on a snow garden (a stone lantern capped with snow, a pine bent under it, a stone basin with its bamboo ladle, a low fence and a plum in red blossom). The paper glows with the sky's light, and at night the lantern's candle and the brazier light the room; rain falls as snow here. Instrument: **Tea House Koto** (thirteen plucked strings in a small wooden room, bright near the bridge and gentler further off, the open strings ringing softly along with what you play; presets Tea House Koto, Winter Strings, Near the Bridge, Night Tea). Visual: **Steam Lines**: each note sends a wisp curling off the tea's steam toward its key, held notes draw it up and brighten it, runs draw your melody up the steam, chords puff a rounder cloud (warm for major, cool for minor), and a hard note knocks a snowflake off the lantern's cap. **Frost Grow** on the paper is its second visual, and **Screens open** slides the screens.
          - **Zen Rock Garden** (mood: ordered calm). From the veranda of a temple hall: raked white gravel with five stones in three groups on moss islands, a low earthen wall with a tiled cap, a maple that turns with the season by your city's date, a bamboo water-knocker by its stone basin and a tall cedar beyond the wall. The sun or the moon rakes light across the ridges; rain darkens the gravel, snow fills the grooves and caps the stones, and a humid night brings fireflies over the moss. Instrument: **Zen Shakuhachi** (an end-blown bamboo flute in the open air: each note begins as breath and becomes tone, and a far slope answers it; presets Zen Shakuhachi, Mountain Breath, Hollow Bamboo, Still Air). Visual: **Rake Lines**: each note rakes a new ring round the stone nearest its key, held notes deepen it, runs rake a sweeping curve from stone to stone, chords re-rake the bed in a slow wave, and the grooves settle back to the morning's pattern over a few minutes. **Season** follows the date or keeps one.
          - **New skies everywhere:** **iridescent clouds**: thin cloud near the sun takes soft mother-of-pearl colours along its edges (one light-cloud spell in two in random weather), with an Advanced **Iridescence** slider. A new weather, **Rime frost**: still, freezing fog that feathers the windward edges of trees, rails, roofs and stones white over ten to twenty minutes and drops off in the sun, with an Advanced **Rime speed** slider. Advanced's Night sky group is now **Sky extras**. The Gentle, Dramatic and Dreamy looks set the new sliders too.
          - **New sounds:** a far temple bell **in the key you are playing in** (the first sound to follow your key), paper screens rustling in a draught, a bamboo water-knocker that fills, tips and clacks on its stone, and a bush warbler on spring and summer mornings.
          - **Pitch bend and pressure** reach the built-in instruments for the first time: the koto's press and yuri, the shakuhachi's kari and meri. The older instruments play as before.

          **Hear them first:** tea-house-koto-demo, zen-shakuhachi-demo, tea-house-snow-ambience and zen-rock-garden-ambience are below (original clips rendered on the build machine: a snowy dusk in the tea house with the temple bell, and a spring morning in the garden with one whole turn of the water-knocker).

          **Ear-and-eye checklist:**
          - **Playing notes** (no song to play along to): hirajōshi on E (E, F, A, B, C and their octaves) on the koto, phrases falling to a low E with space between them; the shakuhachi's own five, D, F, G, A and C, in long breaths with silence between.
          - **The koto's press on the wheel:** pluck a note, then push the pitch wheel up: the string glides up as far as a whole tone and back as you let go, with no new pluck. **Yuri on pressure:** lean into a long note (aftertouch, if your keyboard sends it) for a slow, uneven vibrato that starts a moment after the pluck.
          - **The shakuhachi's meri on pressure:** lean into a long note and it sinks and darkens; ease off and it rises back. **Muraiki on a hard note:** strike a key hard and the note bursts with breath as it starts.
          - **The temple bell in your key:** play a while in one key and the bell's next strike (every few minutes, fuller from dusk in the tea house) rings that key's keynote, low; a strike that is ringing never changes. Until it hears a key it rings E.
          - **Rime building on a foggy morning:** pick **Rime frost** (Sky → Weather) and watch the edges feather white (Advanced → Rime speed hurries it); the sun melts it once the fog goes.
          - **Iridescent edges** on thin cloud near the sun: pick **Light cloud** with the sun 5° to 50° up and look near the sun for soft pinks and greens along the cloud's edges.
          - **Smoothness** on Smooth (Display → Quality → Smooth).
          - **The two place cards** in the gallery breathe at a steady pace of their own: steam over a snow garden through a lattice, with the koto's thirteen strings along the bottom; raked circles round five stones, with five rings on the bamboo along the top for the shakuhachi's five holes.

          **Sets 7 & 8 — Night Skies: Aurora Fjord and Bioluminescent Bay.** Two new sets at the end of the gallery, each a world, a visual, an instrument and a soundscape that belong together.

          - **Aurora Fjord** (after Mac Miller's "Wings"; mood: awe-struck, cold, electric). A jetty at the head of a fjord, looking down it toward the pole: steep walls, still black water mirroring the aurora, a fishing village's lights and drifting ice. Instrument: **Polar Choir** (a breathy, glassy choir that swells while you hold; presets Polar Choir, Far Voices, Bowed Glass, Hush). Visual: **Curtain Lights**: every note sends a ripple through the aurora curtains where its key sits, held notes glow, and chords tint the curtains.
          - **Bioluminescent Bay** (after Lana Del Rey's "Happiness Is a Butterfly"; mood: magical, secret). A sheltered cove at night where the plankton glow: headlands with palms and mangroves, a still bay mirroring the stars, a moored boat's lantern and a lighthouse blinking on the far point. Instrument: **Plankton Keys** (a soft electric piano whose notes throw glassy sparks, in a slow tremolo haze; presets Plankton Keys, Glow Wake, Tide Tines, Midnight Bay). Visual: **Glow Wake**: notes light the water where their keys fall, and quick runs leave glowing wakes.
          - **New skies everywhere:** **the aurora**, by your city: australis in the south, borealis in the north, coming and going with the activity and your latitude. The fjord and the bay gain an **Aurora** choice (Follow the sky, Always, Never), and Advanced an **Aurora** slider. **Real stars and constellations** from a 919-star catalogue (the Southern Cross over Melbourne), with an Advanced **Constellation lines** slider. Two new weathers: **Humid night** with fireflies, and **Diamond dust** with light pillars and glittering crystals. **Deep night** is a new Hold the light choice. The Gentle, Dramatic and Dreamy looks set the new sliders too.
          - **New sounds:** ice groans and cracks, a far waterfall, lapping water and a distant boat.
          - **Where to see the aurora:** in **Follow the sky** it is the real one, so it shows toward the pole (south from Melbourne) and is best seen in the fjord and the bay, which look that way. In **Always** it stands wherever the world looks.

          **Hear them first:** polar-choir-demo, plankton-keys-demo, aurora-fjord-ambience and bioluminescent-bay-ambience are below (original clips rendered on the build machine; never the songs).

          **Ear-and-eye checklist:**
          - **Play-along test:** "Wings" in **A♭ major** at a half-time **60** on Polar Choir, and "Happiness Is a Butterfly" in **D major** at **68** on Plankton Keys. They should blend, never clash.
          - **The choir** swells while you hold and breathes; **Vowel** sweeps it from "oo" to "ee".
          - **The keys** bark when you dig in and scatter sparks.
          - **Curtain Lights:** notes ripple the aurora curtains and chords tint them.
          - **Glow Wake:** notes light the bay's water and runs leave wakes.
          - **The Southern Cross** in every night sky, and the Constellation lines slider (Advanced) brings the lines up and down.
          - **Fireflies** on a Humid night; **light pillars** in Diamond dust.
          - **The aurora from Melbourne** sits low in the south and, in Follow the sky, only shows in strong activity: set Aurora to **Always** in the fjord to see it any night.
          - **Smoothness** on Smooth (Display → Quality → Smooth).
          - **The two new cards** in the gallery breathe with their songs.

          **Builds 239+ — more:** new weathers **Snow flurries, Freezing drizzle, Squall, Thunderheads, Dust storm, Ice fog**; Advanced gains **Gentle / Dramatic / Dreamy** one-tap looks, **Reset Advanced**, **Calm random weather**, and sliders for wind, mist, halos, frost, rain, snow, gusts, clouds, stars, storm-flash rate, ground-drying time, rainbow brightness, and **moon and sun size** (try 2× moon for a supermoon). **Builds 237–238 — Advanced weather** (under the weather picker): how fast a picked weather arrives, how slowly random weather blends, spell length, how long the ground takes to dry, and rainbow brightness; plus new **Ice fog**, **Thunderheads** and **Dust storm** weathers. A picked weather now takes hold in 12 s (it was 60). **Build 235 — two more weathers:** **Hail** and **Smoke haze**. **Builds 231–234 — three more weathers:** **Fog bank** (thick white-out), **Sleet** (rain and snow together) and **Monsoon** (a hard, warm downpour), all under Sky → Weather and in random weather, in every world. **Build 230 — Rainbows and Sun-showers.** A new **Sun-shower** weather (sun through light rain) in Sky controls, and **rainbows** in every world's sky: a bright primary bow and a fainter reversed secondary opposite the sun, strongest in sun-showers and softer after the rain, only with the sun 1°–42° up (none in the snowy cabin). Birds sing up while a rainbow stands. Try Sky → Weather → Sun-shower with the sun low (morning or late afternoon).

          **Sets 5 & 6 — Cosy Windows: Snowbound Cabin Window and Bedroom Window at Dawn.** Two new sets in the gallery, each a world, a visual, an instrument and a soundscape that belong together.

          - **Snowbound Cabin Window** (after Mac Miller's "Stay"; mood: hushed, safe, warm). Inside a log cabin at a frosted three-by-two window: snowy alpine peaks that catch the alpenglow, pines, a far cabin whose window lights at dusk, a frozen creek, and the fire behind you lighting the frame, the sill, a candle and a mug. Instrument: **Cabin Felt** (felt upright with a horn that follows your top line). Visual: **Frost Grow**: hold notes and the frost creeps further over the glass; each note melts a warm clear patch where its key sits, which freezes back over when you let go; chords flare the fire. Rain falls as snow here, storms are blizzards.
          - **Bedroom Window at Dawn** (after Mac Miller's "Dunno"; mood: soft, waking). A painted sash window behind sheer curtains: rooftops and chimneys, houses lighting up as the morning comes, a street lamp, a big tree with the odd bird, a street that mirrors the lights after rain. Instrument: **Morning Box** (celesta or music box over a wall that builds). Visual: **Curtain Light**: holding notes swells the morning light, every note puffs air into the curtains at its key's place, high notes make dust motes glint, chords tint the light gold, rose or lilac, and at night notes twinkle the fairy lights. **Window open** (a setting) lets the curtains move more and the street come closer.
          - **New skies everywhere:** ice halos and sundogs on icy light-cloud days (moon halos at night), the pink Belt of Venus at twilight, pastel dawns about one morning in three, **Blizzard** and **After the rain** weathers (wet beaches and roads shine, drips fall). **Pastel dawn** is a new Hold the light choice.
          - **New sounds:** a fireplace, a kettle, a waking street, drips after rain and a ticking clock, heard through the glass in the window worlds (outdoor sounds lose their top indoors).

          **Hear them first:** cabin-felt-demo, morning-box-demo, snowbound-cabin-ambience and bedroom-dawn-ambience are below (original clips rendered on the build machine; never the songs).

          **Ear-and-eye checklist:**
          - **Play-along test:** "Stay" in **F♯ major** at its slow half-time pocket (about 67) on Cabin Felt, and "Dunno" in **C♯ major** at 82 on Morning Box. They should blend, never clash.
          - **The horn** follows your top line: legato slurs, fresh phrases scoop.
          - **The wall** builds the longer you play and settles when you stop.
          - **The fire and the kettle** sound right (crackle, roar; rumble, boil, click).
          - **Frost** grows while you hold notes and melts where you play.
          - **The curtains** breathe with the breeze and your notes.
          - **Halos, pastel dawns, blizzards and wet roads** show in the older worlds too.
          - **Smoothness** on Smooth (Display → Quality → Smooth).
          - **The two new cards** in the gallery move with their songs.

          **Sound & MIDI** (gear button, top right): pick the output, restart the audio, switch MIDI keyboards on or off, set the channel. If the sound cuts in and out, choose 512 or 1024 there and press Restart audio.

          **Check each build:** instant key response · soft vs hard feels right · pedal (optional) lingers · visuals land with notes · unplugging stops all sound · reopening restores your instrument and set.
          NOTES
          gh release create "build-$GITHUB_RUN_NUMBER" dist/*.dmg dist/*.zip dist/demo/*.m4a --title "In Strum Meants — build $GITHUB_RUN_NUMBER" --notes-file notes.md
      - name: Report
        if: always()
        run: |
          grep -E "error:|warning: |archs=|valid on disk|satisfies|Build complete|\.zip|dmg ok|\.dmg|CHECK" package.log | tail -n 40 > report.txt || true
          python3 -c "t=open('report.txt').read()[-60000:];print('::notice title=package-report::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
